<html>
  <head>
    <meta charset="utf-8">
    <title>Salida a conocer plantas</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="dist/aframe-environment-component.min.js"></script>
    <link href="https://fonts.googleapis.com/css?family=Voces" rel="stylesheet">
  </head>
  <body>
    <a-scene xr-mode-ui="XRMode: xr" environment="preset:forest">

      <!-- ASSETS: Carga del modelo 3D -->
      <a-assets>
            <a-asset-item id="dog" src="plants.glb"></a-asset-item>
             <a-asset-item id="F" src="flower.glb"></a-asset-item>
      
        </a-assets>


        <!-- Perro 3D -->
        <a-entity gltf-model="#dog" position="-3 0 -2" scale="0.001 0.001 0.001" rotation="0 0 0"color="#09EB1D">
        </a-entity>
       <a-entity gltf-model="#F" position="3 0 -2" scale="0.001 0.001 0.001" rotation="0 0 0"color="#094F0F">
        </a-entity>
       
      <a-entity position="0 1.6 0" rotation="0 0 0"> 
      <a-camera wasd-controls="acceleration:100; fly:true" look-controls position="0 1.6 0"></a-camera> <!-- Esta es por defecto a la altura de los ojos -->
      <a-entity oculus-touch-controls="hand: right"></a-entity>
      <a-entity oculus-touch-controls="hand: left"></a-entity>
      </a-entity>
       

      <!-- Cielo -->
        <a-sky hide-on-enter-ar color="#87CEEB"></a-sky>


      
      
      
      
    </a-scene>
  </body>
</html>
