<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Mini Juego VR PS1 - Cielo Retro Visible</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>

<a-scene 
  background="color: #0e0e0e"
  fog="type: linear; color: #0e0e0e; near: 2; far: 15">

  <!-- Cámara -->
  <a-entity position="0 1.6 0">
    <a-camera>
      <!-- Cursor retro -->
      <a-cursor 
        color="#ffcc00" 
        fuse="true" 
        fuse-timeout="800"
        geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.018">
      </a-cursor>
    </a-camera>
  </a-entity>

  <!-- Cielo con gradiente retro -->
  <a-sky id="sky" color="#ff7700"></a-sky>

  <!-- Suelo estilo PS1 -->
  <a-plane 
    rotation="-90 0 0"
    width="30"
    height="30"
    color="#2e2e2e"
    material="shader: flat">
  </a-plane>

  <!-- Enemigo -->
  <a-box 
    position="0 1 -6"
    depth="1"
    height="1.5"
    width="1"
    color="#7a0000"
    material="shader: flat"
    animation="property: rotation; to: 0 360 0; loop: true; dur: 6000"
    animation__pulse="property: scale; dir: alternate; dur: 1200; to: 1.1 1.1 1.1">
  </a-box>

  <!-- Luz ambiental -->
  <a-light 
    type="ambient" 
    color="#666">
  </a-light>

  <!-- Luz direccional dramática -->
  <a-light 
    type="directional" 
    color="#ffffff"
    intensity="0.6"
    position="1 4 -2">
  </a-light>
