<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>VR Básico A-Frame</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>

<a-scene background="color: #222">
  
  <!-- Cámara -->
  <a-entity position="0 1.6 3">
    <a-camera></a-camera>
  </a-entity>

  <!-- Suelo -->
  <a-plane 
    rotation="-90 0 0" 
    width="10" 
    height="10" 
    color="#555">
  </a-plane>

  <!-- Cubo -->
  <a-box 
    position="0 1 -3" 
    rotation="0 45 0" 
    color="red"
    animation="property: rotation; to: 0 405 0; loop: true; dur: 4000">
  </a-box>

  <!-- Luz -->
  <a-light type="ambient" color="#BBB"></a-light>
  <a-light type="directional" position="1 3 2"></a-light>

</a-scene>

</body>
</html>
