<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Juego PS1 VR</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body { margin: 0; overflow: hidden; background: black; }
</style>
</head>
<body>

<!-- THREE CORE -->
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>

<!-- VR BUTTON (VERSIÓN CORRECTA, NO JSM) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/vr/VRButton.js"></script>

<script>
/* ================= ESCENA ================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.Fog(0x000000, 2, 20);

/* ================= CÁMARA ================= */
const camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.1,
    100
);
camera.position.set(0, 1.6, 5);

/* ================= RENDER ================= */
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(1);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

/* ================= LUCES ================= */
scene.add(new THREE.AmbientLight(0x555555));

const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(1, 3, 2);
scene.add(light);

/* ================= SUELO ================= */
const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(50, 50),
    new THREE.MeshStandardMaterial({ color: 0x333333 })
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

/* ================= ENEMIGO ================= */
const enemy = new THREE.Mesh(
    new THREE.BoxGeometry(1, 1, 1),
    new THREE.MeshStandardMaterial({
        color: 0xff0000,
        flatShading: true
    })
);
enemy.position.set(0, 1, -8);
scene.add(enemy);

/* ================= DISPAROS ================= */
const bullets = [];
function shoot(controller) {
    const bullet = new THREE.Mesh(
        new THREE.SphereGeometry(0.05, 6, 6),
        new THREE.MeshBasicMaterial({ color: 0xffff00 })
    );

    const dir = new THREE.Vector3();
    controller.getWorldDirection(dir);

    bullet.position.copy(controller.position);
    bullet.userData.velocity = dir.multiplyScalar(0.5);

    bullets.push(bullet);
    scene.add(bullet);
}

/* ================= CONTROLLER ================= */
const controller = renderer.xr.getController(0);
controller.addEventListener('selectstart', () => shoot(controller));
scene.add(controller);

/* ================= LOOP ================= */
renderer.setAnimationLoop(() => {

    // IA enemiga
    const dir = new THREE.Vector3();
    dir.subVectors(camera.position, enemy.position).normalize();
    enemy.position.add(dir.multiplyScalar(0.02));
    enemy.rotation.y += 0.02;

    // Balas
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.position.add(b.userData.velocity);

        if (b.position.distanceTo(enemy.position) < 0.6) {
            scene.remove(enemy);
            scene.remove(b);
            bullets.splice(i, 1);
        }
    }

    renderer.render(scene, camera);
});

/* ================= RESIZE ================= */
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
