<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Mini Juego VR PS1</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>

<script>
/* ========= COMPONENTE DISPARO ========= */
AFRAME.registerComponent('shooter', {
  init: function () {
    window.addEventListener('click', () => {
      const bullet = document.createElement('a-sphere');
      bullet.setAttribute('radius', '0.05');
      bullet.setAttribute('color', 'yellow');

      const cam = document.querySelector('[camera]');
      const pos = new THREE.Vector3();
      cam.object3D.getWorldPosition(pos);
      bullet.setAttribute('position', pos);

      const dir = new THREE.Vector3();
      cam.object3D.getWorldDirection(dir);

      bullet.setAttribute('velocity', `${dir.x * 10} ${dir.y * 10} ${dir.z * 10}`);
      bullet.setAttribute('dynamic-body', 'shape: sphere; mass: 0.1');

      document.querySelector('a-scene').appendChild(bullet);

      setTimeout(() => bullet.remove(), 3000);
    });
  }
});
</script>

<a-scene background="color: #111">

  <!-- Cámara -->
  <a-entity position="0 1.6 0" shooter>
    <a-camera>
      <a-cursor color="white"></a-cursor>
    </a-camera>
  </a-entity>

  <!-- Suelo -->
  <a-plane 
    rotation="-90 0 0"
    width="20"
    height="20"
    color="#444">
  </a-plane>

  <!-- Enemigo -->
  <a-box 
    id="enemy"
    position="0 1 -5"
    color="red"
    animation="property: position; dir: alternate; dur: 2000; to: 2 1 -3">
  </a-box>

  <!-- Luz -->
  <a-light type="ambient" color="#888"></a-light>
  <a-light type="directional" position="1 3 2"></a-light>

</a-scene>

</body>
</html>
