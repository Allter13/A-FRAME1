<html>
  <head>
    <meta charset="utf-8">
    <title>Fantasia</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>
  <body>
    <a-scene xr-mode-ui="XRMode: xr">

      <!-- ASSETS: Carga del modelo 3D -->
      <a-assets>
            <a-asset-item id="dog" src="chihuahua_derp_dog.glb"></a-asset-item>
      
        </a-assets>


        <!-- Perro 3D -->
         <a-entity grabbable position="-3 0 -2">
            <a-entity gltf-model="#dog"  scale="2 2 2" rotation="0 0 0"> </a-entity>
        </a-entity>
       

        <!-- SUELO (césped) -->
        <a-plane position="0 0 -6" rotation="-90 0 0" width="30" height="30" color="#7BC043"></a-plane>



      <!-- Cielo -->
        <a-sky hide-on-enter-ar color="#87CEEB"></a-sky>


      <a-entity>
        <a-entity camera look-controls wasd-controls position="0 1.6 0"></a-entity>
        <a-entity id="leftHand" hand-tracking-grab-controls="hand: left;"></a-entity>
        <a-entity id="rightHand" hand-tracking-grab-controls="hand: right;"></a-entity>  
        </a-entity>
      
      
      
    </a-scene>
  </body>
</html>
